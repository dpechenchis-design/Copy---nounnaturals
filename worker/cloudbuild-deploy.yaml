# Noun ART: updates the Gemini reader by itself (owner, Nov 17 2026: never Cloud Shell again).
# The Cloud Build trigger "art-reader-update" runs this on every push to main that touches worker/ or src/lib/
# (worker/auto-update-setup.sh makes the trigger once). It builds the reader from the repo root, saves the image
# under the commit's short id and as latest, then moves the job art-reader to it. The job keeps its secrets,
# service account, schedule and settings; only the image changes. If any step fails, the job keeps the image it had.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "worker/Dockerfile", "-t", "${_IMAGE_BASE}:${SHORT_SHA}", "-t", "${_IMAGE_BASE}:latest", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE_BASE}"]
  - id: update-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "jobs", "update", "${_JOB}", "--region", "${_REGION}", "--image", "${_IMAGE_BASE}:${SHORT_SHA}", "--quiet"]
substitutions:
  _REGION: us-east1
  _JOB: art-reader
  _IMAGE_BASE: us-east1-docker.pkg.dev/${PROJECT_ID}/art/art-reader
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1200s
